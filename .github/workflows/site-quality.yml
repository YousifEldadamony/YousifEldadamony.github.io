name: Site quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Download and verify the accessibility checker
        run: |
          curl --fail --silent --show-error --location --max-time 60 https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.3/axe.min.js -o "$RUNNER_TEMP/axe.min.js"
          echo "880970c081707360e64f34cea25ff91892f5bc95675b0776925b9709dd8a68bb  $RUNNER_TEMP/axe.min.js" | sha256sum --check
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check structure, behavior, and accessibility
        env:
          AXE_CORE_PATH: ${{ runner.temp }}/axe.min.js
        run: python -m unittest discover -s tests -v
